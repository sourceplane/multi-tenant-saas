apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web-console-next
  description: Next.js 15 + opennextjs/cloudflare delivery of the Sourceplane web console (per-environment, Workers + Static Assets)
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: starter-ui
  path: apps/web-console-next
  # The deploy smoke health-checks the api-edge worker
  # (api-edge-<env>/health), so api-edge must be live before this
  # component's stage/prod deploy+smoke runs. Without this ordering the smoke
  # races api-edge's concurrent deploy and fails with curl exit 22 (404).
  dependsOn:
    - component: api-edge
    # Shared workspace packages this component BUNDLES. The edge makes the
    # relationship visible to `orun plan` and ORDERS the run: when both sides
    # are in scope, the package's lane precedes this one, so a build never
    # races the thing it compiles against.
    #
    # It does NOT pull this component into the changed set. `--changed` is
    # path-based: a commit touching only `packages/db` plans `db` alone
    # (measured on orun v2.53.2 — 1 component, 3 jobs), and an edge whose
    # other side is unselected is dropped with a warning. Forcing a bundling
    # Worker to redeploy takes an explicit `# ci:` marker, which is exactly
    # why the bootstrap stamps them on retry.
    - component: contracts
    - component: sdk
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  # How the console runs itself for orun.work's live Preview tab
  # (saas-parallel-baselining PB4): `orun preview` starts this, and a coding
  # session keeps it running while it works, so the person watches it change
  # as it is built. The dev server binds the box's loopback only, on a fixed
  # port, and installs first, so a checkout the session has not installed yet
  # still comes up.
  # Kept small on purpose, for looking at the UI inside the session's own box:
  # the console alone, `next dev` on the loopback, and no `needs`, so none of
  # the twelve workers, the API edge, Supabase or wrangler start. Its API is
  # the product's deployed STAGE: NEXT_PUBLIC_DEPLOY_ENV=stage, the same
  # variable a stage build is given (`environmentBuildVar` below), locks it to
  # stage's API edge from the committed app config. Only the console's own
  # packages are installed (`--filter ...`); `next` itself runs, not `pnpm
  # exec next`; and its heap is capped at 1 GiB, so it can never starve the
  # agent. The token-free pages (the landing page, /login, /demo) show in
  # full; pages behind sign-in show the sign-in prompt.
  preview:
    run:
      - sh
      - -c
      - pnpm install --frozen-lockfile --prefer-offline --filter "@saas/web-console-next..." && exec node_modules/.bin/next dev -H 127.0.0.1 -p 3001
    port: 3001
    path: /
    env:
      NEXT_PUBLIC_DEPLOY_ENV: stage
      NODE_OPTIONS: --max-old-space-size=1024
      NEXT_TELEMETRY_DISABLED: "1"
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@saas/web-console-next"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both are deployed in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Worker is named per-env (sourceplane-web-console-next-{dev,stage,prod}),
    # matching the prior Pages-project naming convention so the cutover in
    # Task 0083 only needs to repoint the custom domain.
    workerName: sourceplane-web-console-next
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exposed to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: rahulvarghesepullely

    environmentBuildVar: NEXT_PUBLIC_DEPLOY_ENV

    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/web-console-next

    # Smoke: follow redirects (root `redirect("/orgs")` is a 307) and confirm
    # the SSR'd page contains the console marker. The api-edge worker is the
    # same hostname pattern as before.
    # Buffer curl into a variable before grepping so `grep -q` matching early
    # cannot SIGPIPE curl and produce a flaky exit-23 race (observed on prod
    # in main CI run 26628207777 even though the site was live).
    # `${WORKERS_DEV_SUBDOMAIN}` is exported by the composition's deploy/smoke
    # step from the `workersDevSubdomain` parameter above (BF3: no duplicated
    # subdomain literal here).
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Sourceplane Console' && health=$(curl -sf \"https://api-edge-${ORUN_ENVIRONMENT}.${WORKERS_DEV_SUBDOMAIN}.workers.dev/health\") && echo \"${health}\" | grep -q ok"
  labels:
    team: platform
    layer: delivery
    surface: web-console-next
    runtime: cloudflare
