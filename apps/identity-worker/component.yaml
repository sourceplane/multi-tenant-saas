apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: identity-worker
  description: Cloudflare Worker for the Identity auth runtime
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/identity-worker
  dependsOn:
    - component: cloudflare-hyperdrive
    - component: policy-worker
    - component: membership-worker
    - component: notifications-worker
    # Shared workspace packages this component BUNDLES. The edge makes the
    # relationship visible to `orun plan` and ORDERS the run: when both sides
    # are in scope, the package's lane precedes this one, so a build never
    # races the thing it compiles against.
    #
    # It does NOT pull this component into the changed set. `--changed` is
    # path-based: a commit touching only `packages/db` plans `db` alone
    # (measured on orun v2.53.2 — 1 component, 3 jobs), and an edge whose
    # other side is unselected is dropped with a warning. Forcing a bundling
    # Worker to redeploy takes an explicit `# ci:` marker, which is exactly
    # why the bootstrap stamps them on retry.
    - component: contracts
    - component: db
    - component: notifications-client
  # Runtime secrets, wire-now-seed-later: best-effort references —
  # an unseeded key is skipped at resolve (and by secrets-live), so
  # this block is inert until the value is stored in orun secrets.
  # BF6 wiring documents from orun secrets (SEC-JOB): lease-published by
  # the infra components; wire-live renders the wrangler template from
  # these instead of Secrets Manager documents.
  secretEnv:
    WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://halo/multi-tenant-saas/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
    WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://halo/multi-tenant-saas/prod/WIRING_CLOUDFLARE_HYPERDRIVE"

  optionalSecretEnv:
    GITHUB_OAUTH_CLIENT_SECRET: "secret://halo/multi-tenant-saas/{{ .environment }}/GITHUB_OAUTH_CLIENT_SECRET"
    GOOGLE_OAUTH_CLIENT_SECRET: "secret://halo/multi-tenant-saas/{{ .environment }}/GOOGLE_OAUTH_CLIENT_SECRET"
    OAUTH_STATE_SECRET: "secret://halo/multi-tenant-saas/{{ .environment }}/OAUTH_STATE_SECRET"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: multi-tenant-saas

    # Runtime worker secrets, pushed by the secrets-live step from the
    # values orun resolves for the optionalSecretEnv references below.
    runtimeSecrets: "GITHUB_OAUTH_CLIENT_SECRET,GOOGLE_OAUTH_CLIENT_SECRET,OAUTH_STATE_SECRET"
    turboFilter: "@saas/identity-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/identity-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/identity-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    preDeployCommand: "echo 'No pre-deploy step configured.'"
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: identity
    runtime: cloudflare
